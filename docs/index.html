<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digitale benchmark Flanders Build · Verstraete.team</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --oranje:#E84E0F; --oranje-2:#F58A5C; --oranje-zacht:#FDEEE6;
  --bg:#EEEEEB; --vlak:#FFFFFF; --vlak-2:#F7F7F5; --tekst:#1E1F21; --tekst-2:#5E6164; --tekst-3:#8A8D90;
  --lijn:#DCDDD8; --steen:#B3B6B8; --steen-donker:#7D8184; --grafiet:#26282B;
  --v1:#2F5F8F; --v2:#6E8B3D; --v3:#8C5A9E;
  --pos:#2E7D4F; --neg:#B3261E;
  --kop:#26282B; --kop-tekst:#FFFFFF;
  --schaduw:0 1px 2px rgba(20,20,20,.06), 0 8px 24px -12px rgba(20,20,20,.18);
  --r:10px;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --oranje-zacht:#3A2218; --bg:#141517; --vlak:#1D1F22; --vlak-2:#24272A; --tekst:#ECECEA; --tekst-2:#B2B4B6; --tekst-3:#85888B;
    --lijn:#33363A; --steen:#5C6064; --steen-donker:#8B8F93; --grafiet:#E6E6E3; --v1:#6FA3D6; --v2:#9DBB68; --v3:#C08ED3;
    --pos:#5FBF84; --neg:#F07A72; --kop:#0F1012; --schaduw:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --oranje-zacht:#3A2218; --bg:#141517; --vlak:#1D1F22; --vlak-2:#24272A; --tekst:#ECECEA; --tekst-2:#B2B4B6; --tekst-3:#85888B;
  --lijn:#33363A; --steen:#5C6064; --steen-donker:#8B8F93; --grafiet:#E6E6E3; --v1:#6FA3D6; --v2:#9DBB68; --v3:#C08ED3;
  --pos:#5FBF84; --neg:#F07A72; --kop:#0F1012; --schaduw:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
html,body{margin:0}
body{background:var(--bg);color:var(--tekst);font-family:"Archivo",Arial,"Helvetica Neue",sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--oranje);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}

/* demo-balk */
.demo{background:var(--oranje);color:#fff;text-align:center;font-size:12.5px;padding:6px 14px;font-weight:600}

/* kop */
.kop{background:var(--kop);color:var(--kop-tekst)}
.kop-in{max-width:1400px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo-wit{height:30px;width:auto;display:block;margin-right:6px}
.logo-wit+div{border-left:1px solid rgba(255,255,255,.18);padding-left:20px}
@media (max-width:640px){.logo-wit{height:24px}.logo-wit+div{padding-left:14px}}
.kop h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.2px}
.kop .sub{font-size:12.5px;color:#B9BBBD;margin-top:1px}
.kop .rechts{margin-left:auto;display:flex;align-items:center;gap:10px}
.pulse{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:#C9CBCD}
.pulse i{width:8px;height:8px;border-radius:50%;background:#4CC37A;box-shadow:0 0 0 0 rgba(76,195,122,.6);animation:puls 2.4s infinite}
@keyframes puls{70%{box-shadow:0 0 0 8px rgba(76,195,122,0)}100%{box-shadow:0 0 0 0 rgba(76,195,122,0)}}
.ikoon{width:38px;height:38px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer}
.ikoon:hover{background:rgba(255,255,255,.08)}
.ikoon svg{width:18px;height:18px}
.knop-oranje{background:var(--oranje);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.knop-oranje:hover{filter:brightness(1.08)}
.knop-oranje[disabled]{opacity:.55;cursor:wait}
.knop-oranje svg{width:16px;height:16px}

/* filterbalk */
.filters{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--lijn);top:env(safe-area-inset-top,0px)}
.filters-in{max-width:1400px;margin:0 auto;padding:10px 28px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.seg{display:inline-flex;background:var(--vlak);border:1px solid var(--lijn);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:6px;cursor:pointer;color:var(--tekst-2);font-weight:600;font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--grafiet);color:var(--vlak)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--lijn);background:var(--vlak);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap;color:var(--tekst-2);font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--grafiet);background:var(--grafiet);color:var(--vlak)}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--tekst-2);cursor:pointer;user-select:none}
.toggle input{appearance:none;width:30px;height:18px;border-radius:999px;background:var(--steen);position:relative;cursor:pointer;transition:background .2s;margin:0}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle input:checked{background:var(--grafiet)}
.toggle input:checked::after{transform:translateX(12px)}
.vergelijk{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.vergelijk select{border:1px dashed var(--steen-donker);background:var(--vlak);border-radius:999px;padding:5px 10px;font-size:12.5px;cursor:pointer;max-width:190px}
.segsel{border:1px solid var(--lijn);background:var(--vlak);border-radius:9px;padding:7px 10px;font-size:13px;font-weight:600;color:var(--tekst-2);cursor:pointer}
.knop-licht{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:8px;padding:9px 13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.knop-licht:hover{background:rgba(255,255,255,.08)}.knop-licht svg{width:16px;height:16px}.knop-licht[hidden]{display:none}
.vchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 6px 4px 10px;font-size:12.5px;font-weight:600;color:#fff}
.vchip button{border:0;background:rgba(255,255,255,.25);color:#fff;width:18px;height:18px;border-radius:50%;cursor:pointer;line-height:1;font-size:12px;padding:0}

main{max-width:1400px;margin:0 auto;padding:22px 28px 60px}
.kaart{background:var(--vlak);border:1px solid var(--lijn);border-radius:var(--r);box-shadow:var(--schaduw);padding:18px 20px}
.kaart h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.1px}
.kaart .uitleg{margin:3px 0 14px;color:var(--tekst-3);font-size:12.5px}
.kaart-kop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.link{border:0;background:none;color:var(--tekst-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0;font-size:12.5px}

/* held */
.held{display:grid;grid-template-columns:minmax(300px,.9fr) minmax(0,2.1fr);gap:18px;margin-bottom:18px}
.positie{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;min-height:340px;
  background-image:linear-gradient(var(--lijn) 1px,transparent 1px),linear-gradient(90deg,var(--lijn) 1px,transparent 1px);background-size:28px 28px;background-position:-1px -1px}
.positie::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,var(--vlak) 35%,color-mix(in srgb,var(--vlak) 70%,transparent));pointer-events:none}
.positie>*{position:relative}
.positie .label{font-size:13px;font-weight:600;color:var(--tekst-2)}
.rang{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.rang b{font-size:112px;line-height:.9;font-weight:800;color:var(--oranje);letter-spacing:-5px}
.rang span{font-size:20px;color:var(--tekst-2);font-weight:500}
.delta{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px;border-radius:999px;padding:3px 9px}
.delta.op{color:var(--pos);background:color-mix(in srgb,var(--pos) 14%,transparent)}
.delta.neer{color:var(--neg);background:color-mix(in srgb,var(--neg) 14%,transparent)}
.delta.gelijk{color:var(--tekst-2);background:var(--vlak-2)}
.positie p{font-size:15.5px;color:var(--tekst);margin:14px 0 0;max-width:42ch}
.race-wrap{position:relative;height:330px}
.race-legende{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12px;color:var(--tekst-2)}
.race-legende span{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.race-legende i{width:14px;height:3px;border-radius:2px;display:inline-block}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-bottom:18px}
.kpi{padding:16px 18px}
.kpi .t{font-size:12.5px;color:var(--tekst-2);font-weight:600}
.kpi .w{display:flex;align-items:baseline;gap:8px;margin:6px 0 2px}
.kpi .w b{font-size:32px;font-weight:800;letter-spacing:-1px}
.kpi svg{width:100%;height:34px;display:block;margin-top:6px}

.rij{display:grid;gap:18px;margin-bottom:18px}
.rij-2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.rij-3{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.grafiek{position:relative;height:280px}

/* rangschikking */
.rlijst{display:flex;flex-direction:column;gap:3px}
.rregel{display:grid;grid-template-columns:30px minmax(110px,170px) 1fr 40px 46px;align-items:center;gap:10px;padding:5px 6px;border-radius:7px;cursor:pointer;border:0;background:transparent;text-align:left;width:100%}
.rregel:hover{background:var(--vlak-2)}
.rregel .nr{color:var(--tekst-3);font-size:12px;font-weight:600;text-align:right}
.rregel .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.balk{height:12px;background:var(--vlak-2);border-radius:999px;overflow:hidden}
.balk i{display:block;height:100%;width:0;background:var(--steen);border-radius:999px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.rregel.eigen{background:var(--oranje-zacht)}
.rregel.eigen .nm{color:var(--oranje)}
.rregel.eigen .balk i{background:var(--oranje)}
.rregel .ct{font-weight:700;text-align:right}
.rregel .dl{font-size:11.5px;font-weight:700;text-align:right}
.dl.op{color:var(--pos)}.dl.neer{color:var(--neg)}.dl.gelijk{color:var(--tekst-3)}

/* sociaal */
.srij{display:grid;grid-template-columns:minmax(120px,1.4fr) 1fr 74px 54px 96px;gap:10px;align-items:center;padding:7px 6px;border-radius:7px;font-size:13px;border:0;background:transparent;width:100%;text-align:left;cursor:pointer}
.srij:not(.skop):hover{background:var(--vlak-2)}
.srij.skop{cursor:default;font-size:11.5px;color:var(--tekst-3);font-weight:600;border-bottom:1px solid var(--lijn);border-radius:0}
.srij.eigen{background:var(--oranje-zacht)}.srij.eigen .nm{color:var(--oranje)}
.srij .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srij .vb{display:flex;align-items:center;gap:8px}.srij .vb .balk{flex:1}
.srij .r{text-align:right}
.soc-leeg{padding:26px 6px;color:var(--tekst-2);font-size:13.5px;max-width:70ch}
.kanalen{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kanalen a{font-size:12px;border:1px solid var(--lijn);border-radius:999px;padding:3px 10px;text-decoration:none;color:var(--tekst-2)}
.kanalen a:hover{border-color:var(--grafiet);color:var(--tekst)}
@media (max-width:640px){.srij{grid-template-columns:minmax(90px,1fr) 80px 56px 40px 0;font-size:12px}.srij>:last-child{display:none}}

/* heatmap */
.tabel-wrap{overflow-x:auto}
.heat{border-collapse:separate;border-spacing:3px;width:100%;font-size:12.5px}
.heat th{font-weight:600;color:var(--tekst-2);font-size:11.5px;text-align:center;padding:4px;white-space:nowrap}
.heat th:first-child{text-align:left}
.heat td.nm{white-space:nowrap;font-weight:600;padding-right:8px;cursor:pointer}
.heat td.c{text-align:center;border-radius:6px;min-width:52px;height:30px;cursor:pointer;font-weight:600;transition:transform .12s}
.heat td.c:hover{transform:scale(1.08);outline:2px solid var(--grafiet)}
.heat tr.eigen td.nm{color:var(--oranje)}

/* media / momentum */
.mlijst{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.mregel{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:13px}
.mregel .mb{height:6px;border-radius:999px;background:var(--vlak-2);margin-top:4px;overflow:hidden}
.mregel .mb i{display:block;height:100%;background:var(--steen-donker);border-radius:999px;transition:width .6s}
.mom{display:flex;flex-direction:column;gap:6px}
.momr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:8px;background:var(--vlak-2);cursor:pointer;border:0;width:100%;text-align:left}
.momr.eigen{background:var(--oranje-zacht)}
.momr b{font-size:13px}
.split{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
.donut{position:relative;height:150px}
.donut .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.donut .mid b{font-size:24px;font-weight:800;display:block;line-height:1}
.donut .mid span{font-size:11px;color:var(--tekst-3)}

/* feed */
.feed-filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;align-items:center}
.feed-filters input,.feed-filters select{border:1px solid var(--lijn);background:var(--vlak-2);border-radius:8px;padding:8px 10px;font-size:13px}
.feed-filters input{min-width:240px;flex:1;max-width:380px}
.actief-filter{display:inline-flex;gap:6px;align-items:center;background:var(--grafiet);color:var(--vlak);border-radius:999px;padding:4px 6px 4px 11px;font-size:12px;font-weight:600}
.actief-filter button{border:0;background:rgba(127,127,127,.35);color:inherit;border-radius:50%;width:18px;height:18px;cursor:pointer;padding:0}
.post{display:grid;grid-template-columns:86px minmax(0,1fr);gap:14px;padding:12px 4px;border-top:1px solid var(--lijn);animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.post .dt{font-size:12px;color:var(--tekst-3);font-weight:600}
.post .bd{font-size:12.5px;font-weight:700;border:0;background:none;padding:0;cursor:pointer;color:var(--tekst-2)}
.post.eigen .bd{color:var(--oranje)}
.post a.tt{display:block;font-weight:600;font-size:14.5px;text-decoration:none;margin:2px 0 4px;line-height:1.35}
.post a.tt:hover{text-decoration:underline}
.post .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--tekst-3)}
.tag{background:var(--vlak-2);border:1px solid var(--lijn);border-radius:999px;padding:1px 8px;font-size:11.5px;color:var(--tekst-2)}
.nieuw{background:var(--oranje);color:#fff;border-radius:999px;padding:1px 7px;font-size:10.5px;font-weight:700}

details.kaart{margin-bottom:12px;padding:14px 20px}
details.kaart summary{cursor:pointer;font-weight:700}
.st{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
.st th{text-align:left;color:var(--tekst-2);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--lijn)}
.st td{padding:6px 8px;border-bottom:1px solid var(--lijn)}
.ok{color:var(--pos)}.fout{color:var(--neg)}

/* lade */
.sluier{position:fixed;inset:0;background:rgba(10,10,10,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.sluier.open{opacity:1;pointer-events:auto}
.lade{position:fixed;top:0;right:0;height:100%;width:min(520px,100%);background:var(--vlak);z-index:41;transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  overflow-y:auto;box-shadow:-20px 0 40px -20px rgba(0,0,0,.35);padding:calc(env(safe-area-inset-top,0px) + 22px) 24px calc(env(safe-area-inset-bottom,0px) + 30px)}
.lade.open{transform:none}
.lade .sluit{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;border:1px solid var(--lijn);background:var(--vlak);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:18px}
.lade h3{margin:0 40px 2px 0;font-size:24px;font-weight:800;letter-spacing:-.5px}
.lade .web{font-size:12.5px;color:var(--tekst-2)}
.lade .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.lade .mini div{background:var(--vlak-2);border-radius:8px;padding:10px 12px}
.lade .mini b{display:block;font-size:22px;font-weight:800}
.lade .mini span{font-size:11.5px;color:var(--tekst-3)}
.lade h4{font-size:13px;margin:20px 0 8px;color:var(--tekst-2)}
.lade .grafiek{height:160px}
.lade .post{grid-template-columns:76px minmax(0,1fr)}

.leeg{text-align:center;padding:60px 20px}
.leeg h2{font-size:22px}
.leeg ol{display:inline-block;text-align:left;color:var(--tekst-2)}
footer{max-width:1400px;margin:0 auto;padding:0 28px 30px;color:var(--tekst-3);font-size:12px}

@media (max-width:1100px){.held,.rij-2,.rij-3{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){
  .kop-in,.filters-in,main{padding-left:16px;padding-right:16px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi .w b{font-size:26px}
  .rang b{font-size:84px}.rregel{grid-template-columns:24px minmax(90px,1fr) 70px 30px 38px}
  .split{grid-template-columns:1fr}.post{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

const D=window.BENCHMARK||{publicaties:[],bedrijven:[],status:[],themas:[],linkedin:[]};

/* ---------- data-hulp ---------- */
const leeftijd=p=>(NU-new Date(p.datum+"T12:00"))/DAG;
const ORG=g=>g==="Organisatie"||g==="Sectororganisatie";
const telt=n=>{if(n===EIGEN)return true;const b=D.bedrijven.find(x=>x.naam===n);if(!b)return true;if(ORG(b.groep)&&!S.orgs)return false;if(S.segment&&b.groep!==S.segment)return false;return true;};
const basis=(p,o={})=>telt(p.bedrijf)&&(o.kanaal===false||!S.kanaal||p.kanaal===S.kanaal)&&(o.thema===false||!S.thema||p.themas.includes(S.thema))&&(!S.strikt||p.naam_in_titel!==false);
function periode(i=0,o){const a=S.dagen*i,b=S.dagen*(i+1);return D.publicaties.filter(p=>{const l=leeftijd(p);return (i===0?l>-2:l>=a)&&l<b&&basis(p,o);});}
const namen=()=>D.bedrijven.filter(b=>telt(b.naam)).map(b=>b.naam);
function ranking(lijst){
  const t=Object.fromEntries(namen().map(n=>[n,{naam:n,totaal:0,pers:0,eigen:0,sociaal:0}]));
  lijst.forEach(p=>{const x=t[p.bedrijf];if(!x)return;x.totaal++;if(p.kanaal==="Pers & nieuws")x.pers++;else if(p.kanaal==="Sociale media")x.sociaal++;else x.eigen++;});
  const r=Object.values(t).sort((a,b)=>b.totaal-a.totaal||a.naam.localeCompare(b.naam));
  r.forEach((x,i)=>x.rang=i&&x.totaal===r[i-1].totaal?r[i-1].rang:i+1);
  return r;
}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const g=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-g);const j=new Date(Date.UTC(t.getUTCFullYear(),0,1));return t.getUTCFullYear()+"-W"+String(Math.ceil(((t-j)/DAG+1)/7)).padStart(2,"0");}
function laatsteWeken(n){const w=[];const ref=new Date(NU-DAG);for(let i=n-1;i>=0;i--){const d=new Date(ref);d.setDate(d.getDate()-7*i);w.push(isoWeek(d));}return w;}
function perWeek(weken,filter){const m={};D.publicaties.forEach(p=>{if(!basis(p)||!filter(p))return;m[p.week]=(m[p.week]||0)+1;});return weken.map(w=>m[w]||0);}
const kleurVergelijk=i=>css(["--v1","--v2","--v3"][i]);
function kleurVan(n){if(n===EIGEN)return css("--oranje");const i=S.vergelijk.indexOf(n);return i>=0?kleurVergelijk(i):css("--steen");}

/* ---------- animaties ---------- */
function telOp(el,naar,dec=0){
  if(!el)return; if(RM){el.textContent=fmt(naar);return;}
  const van=parseFloat(el.dataset.v||0),t0=performance.now(),dur=650;el.dataset.v=naar;
  const stap=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3),v=van+(naar-van)*e;el.textContent=dec?fmt(Math.round(v*10)/10):fmt(Math.round(v));if(k<1)requestAnimationFrame(stap);};
  requestAnimationFrame(stap);
}
function deltaHTML(nu,voor,eenheid="",omgekeerd=false){
  const d=nu-voor; if(!d)return `<span class="delta gelijk">= vorige periode</span>`;
  const goed=omgekeerd?d<0:d>0;
  return `<span class="delta ${goed?"op":"neer"}">${goed?"▲":"▼"} ${fmt(Math.abs(d))}${eenheid}</span>`;
}
function spark(waarden,kleur){
  const w=200,h=34,max=Math.max(1,...waarden),st=w/(waarden.length-1||1);
  const pts=waarden.map((v,i)=>[i*st,h-3-(v/max)*(h-8)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L${w} ${h} L0 ${h}Z" fill="${kleur}" opacity=".12"/><path d="${d}" fill="none" stroke="${kleur}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function grafiek(id,cfg){
  const el=document.getElementById(id); if(!el)return;
  if(charts[id]&&charts[id].canvas===el){charts[id].data=cfg.data;charts[id].options=cfg.options;charts[id].update();return charts[id];}
  if(charts[id])charts[id].destroy();
  return charts[id]=new Chart(el,cfg);
}

/* ---------- positie ---------- */
function renderPositie(){
  const nu=ranking(periode(0)),voor=ranking(periode(1));
  const w=nu.find(r=>r.naam===EIGEN)||{rang:"–",totaal:0},wv=voor.find(r=>r.naam===EIGEN)||{rang:0,totaal:0};
  const top=nu[0],gem=nu.reduce((s,r)=>s+r.totaal,0)/nu.length;
  let zin;
  if(!w.totaal)zin=`Geen publicaties over ${esc(EIGEN)} in ${PERIODE_TXT[S.dagen]}.`;
  else if(w.rang===1)zin=`${esc(EIGEN)} is het meest zichtbare bedrijf van de groep, met ${w.totaal} publicaties.`;
  else zin=`${w.totaal} publicaties in ${PERIODE_TXT[S.dagen]}. ${esc(top.naam)} leidt met ${top.totaal}, het gemiddelde bedrijf haalt ${fmt(gem)}.`;
  const rd=(wv.totaal&&w.totaal)?wv.rang-w.rang:0;
  const deltaRang=!wv.totaal||!w.totaal?`<span class="delta gelijk">geen vergelijking</span>`:rd===0?`<span class="delta gelijk">zelfde plaats als vorige periode</span>`:`<span class="delta ${rd>0?"op":"neer"}">${rd>0?"▲":"▼"} ${Math.abs(rd)} ${Math.abs(rd)===1?"plaats":"plaatsen"}</span>`;

    <div class="rang"><b class="num" id="rang-nr">${w.totaal?w.rang:"–"}</b><span>van ${nu.length}</span></div>${deltaRang}</div><p>${zin}</p>`;
  if(w.totaal&&!RM){const el=$("#rang-nr");const doel=w.rang;let v=Math.min(nu.length,doel+12);const t=setInterval(()=>{el.textContent=v;if(v<=doel)clearInterval(t);v--;},28);}
}

/* ---------- LinkedIn ---------- */
const liRijen=()=>(D.linkedin||[]).filter(x=>x.bedrijf&&telt(x.bedrijf));
function liOverzicht(){
  const rij=liRijen();if(!rij.length)return[];
  const weken=[...new Set(rij.map(x=>x.week))].sort(),stap=Math.max(1,Math.round(S.dagen/7));
  const recent=new Set(weken.slice(-stap)),refWeek=weken[Math.max(0,weken.length-1-stap)];
  return [...new Set(rij.map(x=>x.bedrijf))].map(n=>{
    const r=rij.filter(x=>x.bedrijf===n).sort((a,b)=>a.week<b.week?1:-1);
    const nu=r.find(x=>x.volgers!=null)||r[0];
    const ref=r.find(x=>x!==nu&&x.week<=refWeek&&x.volgers!=null);
    const rec=r.filter(x=>recent.has(x.week)),posts=rec.reduce((t,x)=>t+(x.posts||0),0),reac=rec.reduce((t,x)=>t+(x.reacties||0),0);
    return{naam:n,week:nu.week,volgers:nu.volgers,groei:ref&&nu.volgers!=null?nu.volgers-ref.volgers:null,
      pct:ref&&ref.volgers&&nu.volgers!=null?Math.round(1000*(nu.volgers-ref.volgers)/ref.volgers)/10:null,posts,reacties:reac,inter:posts?Math.round(10*reac/posts)/10:null};
  }).sort((a,b)=>(b.volgers||0)-(a.volgers||0));
}

/* ---------- heatmap ---------- */
function renderHeat(){
  const th=D.themas||[],l=periode(0,{thema:false}),r=ranking(l);
  let rij=r.slice(0,15);[EIGEN,...S.vergelijk].forEach(n=>{if(!rij.find(x=>x.naam===n)){const x=r.find(y=>y.naam===n);if(x)rij.push(x);}});
  const m=rij.map(x=>({n:x.naam,v:th.map(t=>l.filter(p=>p.bedrijf===x.naam&&p.themas.includes(t)).length)}));

  const kl=(v,eigen)=>{if(!v)return `background:var(--vlak-2);color:transparent`;const a=.14+.86*(v/mx);const base=eigen?"232,78,15":donker?"230,230,227":"38,40,43";return `background:rgba(${base},${a.toFixed(2)});color:${a>.5?(eigen||!donker?"#fff":"#111"):"var(--tekst)"}`;};

/* ---------- Excel-export (huisstijl) ---------- */

    const zebra=(ws,r,n)=>{for(let i=1;i<=n;i++){const c=ws.getCell(r,i);if(!(c.font&&c.font.bold))c.font=F;if(r%2===0)c.fill=vul("FFF6F6F6");}};

    const wij=rang.find(r=>r.naam===EIGEN)||{rang:"-",totaal:0};
    [["Positie "+EIGEN,wij.totaal?wij.rang:"-"],["Publicaties "+EIGEN,wij.totaal],["Share of voice",lijst.length?+(100*wij.totaal/lijst.length).toFixed(1)+"%":"-"]].forEach(([l,v],i)=>{
      const a=ws.getCell(6,1+i*2),b=ws.getCell(7,1+i*2);a.value=l;a.font={name:"Arial",size:9,color:{argb:"FF666666"}};b.value=v;b.font={name:"Arial",size:14,bold:true,color:{argb:"FFE84E0F"}};b.alignment={horizontal:"left"};
      [a,b,ws.getCell(6,2+i*2),ws.getCell(7,2+i*2)].forEach(c=>c.fill=vul("FFFDF0EB"));});
    const kols=["Rang","Bedrijf","Pers & nieuws","Website","Totaal",...th];kop(ws,9,kols);const s0=10,s1=s0+rang.length-1;

      ws.getCell(x,1).value={formula:`RANK(E${x},$E$${s0}:$E$${s1})`,result:r.rang};th.forEach((t,j)=>ws.getCell(x,6+j).value=lijst.filter(p=>p.bedrijf===r.naam&&p.themas.includes(t)).length);
      zebra(ws,x,kols.length);if(r.naam===EIGEN)for(let k=1;k<=kols.length;k++){const c=ws.getCell(x,k);c.fill=vul("FFFDF0EB");c.font={...F,bold:true};}});
    const tr=s1+1;ws.getCell(tr,2).value="Totaal groep";for(let k=3;k<=kols.length;k++){const L=ws.getColumn(k).letter;ws.getCell(tr,k).value={formula:`SUM(${L}${s0}:${L}${s1})`};}
    for(let k=1;k<=kols.length;k++){const c=ws.getCell(tr,k);c.fill=vul("FF2D2D2D");c.font={name:"Arial",size:9,bold:true,color:{argb:k<=2?"FFFFFFFF":"FFE84E0F"}};}
    ws.columns.forEach((c,i)=>c.width=i===0?8:i===1?26:i<5?14:16);ws.autoFilter={from:{row:9,column:1},to:{row:s1,column:kols.length}};
    const wp=wb.addWorksheet("Publicaties",{views:[{state:"frozen",ySplit:6,showGridLines:false}]});titel(wp,"Publicaties",sub,7);kop(wp,6,["Datum","Week","Bedrijf","Titel","Medium","Kanaal","Thema's"]);
    lijst.forEach((p,i)=>{const r=7+i;wp.getCell(r,1).value=new Date(p.datum);wp.getCell(r,1).numFmt="dd/mm/yyyy";wp.getCell(r,2).value=p.week;wp.getCell(r,3).value=p.bedrijf;
      wp.getCell(r,4).value={text:p.titel,hyperlink:p.url};wp.getCell(r,5).value=p.medium;wp.getCell(r,6).value=p.kanaal;wp.getCell(r,7).value=p.themas.join(", ");zebra(wp,r,7);wp.getCell(r,4).font={...F,underline:true};
      if(p.bedrijf===EIGEN)for(let k=1;k<=7;k++)wp.getCell(r,k).fill=vul("FFFDF0EB");});
    [11,10,22,70,22,15,34].forEach((w,i)=>wp.getColumn(i+1).width=w);wp.autoFilter={from:{row:6,column:1},to:{row:6+Math.max(1,lijst.length),column:7}};
    const wt=wb.addWorksheet("Trend per week",{views:[{state:"frozen",ySplit:6,xSplit:1,showGridLines:false}]});
    const weken=laatsteWeken(26),bed=rang.map(r=>r.naam);titel(wt,"Publicaties per week (laatste 26 weken)",sub,bed.length+1);kop(wt,6,["Week",...bed]);
    weken.forEach((w,i)=>{const r=7+i;wt.getCell(r,1).value=w;bed.forEach((b,j)=>wt.getCell(r,2+j).value=D.publicaties.filter(p=>p.week===w&&p.bedrijf===b&&basis(p)).length);zebra(wt,r,bed.length+1);});
    wt.getColumn(1).width=11;bed.forEach((b,j)=>{wt.getColumn(2+j).width=Math.max(10,Math.min(20,b.length+2));if(b===EIGEN)wt.getCell(6,2+j).fill=vul("FF2D2D2D");});
    const LO=liOverzicht();if(LO.length){const wsS=wb.addWorksheet("LinkedIn",{views:[{state:"frozen",ySplit:6,showGridLines:false}]});titel(wsS,"LinkedIn-benchmark (laatste meting)",sub,7);
      kop(wsS,6,["Bedrijf","Week","Volgers","Groei","Groei %","Posts","Reacties per post"]);
      LO.forEach((r,i)=>{const x=7+i;[r.naam,r.week,r.volgers,r.groei,r.pct,r.posts,r.inter].forEach((v,k)=>wsS.getCell(x,k+1).value=v??null);zebra(wsS,x,7);if(r.naam===EIGEN)for(let k=1;k<=7;k++){wsS.getCell(x,k).fill=vul("FFFDF0EB");wsS.getCell(x,k).font={...F,bold:true};}});
      [26,11,12,10,10,10,16].forEach((w,i)=>wsS.getColumn(i+1).width=w);
      const wl=wb.addWorksheet("LinkedIn per week",{views:[{state:"frozen",ySplit:6,showGridLines:false}]});titel(wl,"LinkedIn-cijfers per week (manueel ingevuld)","Bron: linkedin_manueel.csv",6);
      kop(wl,6,["Week","Bedrijf","Volgers","Posts","Reacties","Opmerking"]);liRijen().forEach((r,i)=>{const x=7+i;[r.week,r.bedrijf,r.volgers,r.posts,r.reacties,r.opmerking].forEach((v,k)=>wl.getCell(x,k+1).value=v??null);zebra(wl,x,6);});[10,24,12,10,12,40].forEach((w,i)=>wl.getColumn(i+1).width=w);}
    const buf=await wb.xlsx.writeBuffer(),naam=`VT_Benchmark_FlandersBuild_${isoWeek(NU)}.xlsx`;
    const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;

    else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));a.download=naam;document.body.appendChild(a);a.click();a.remove();}
  }catch(e){alert("De Excel kon niet gemaakt worden: "+e.message);console.error(e);}
  finally{knop.disabled=false;}
};

<script>
(async function(){
  const ARTIFACT=false;
  const balk=document.getElementById("demo");
  if(!ARTIFACT){window.startDashboard();return;}
  const wacht=ms=>new Promise(r=>setTimeout(r,ms));
  const metTijd=(p,ms)=>Promise.race([p,wacht(ms).then(()=>null)]);
  for(let i=0;i<20&&!(window.claude&&window.claude.use);i++)await wacht(50);
  let db=null,assets=null;
  if(window.claude&&window.claude.use){[db,assets]=await Promise.all([metTijd(window.claude.use("db"),6000),metTijd(window.claude.use("assets"),6000)]);}
  let echt=false,vorig=null;
  if(db){try{const snap=await db.doc("config/gegevens").get();const d=snap.exists?snap.data():null;
    if(d&&d.asset){vorig=d.asset;await new Promise((ok,nok)=>{const sc=document.createElement("script");sc.src="/_blob/"+d.asset;sc.onload=ok;sc.onerror=nok;document.head.appendChild(sc);});echt=!!window.BENCHMARK;}}catch(e){console.warn("Gegevens niet geladen",e);}}
  if(!echt)window.BENCHMARK=window.BENCHMARK_DEMO;else if(balk)balk.remove();
  window.startDashboard();
  if(assets&&db){
    const k=document.getElementById("laad"),inp=document.getElementById("laad-bestand"),lbl=k.querySelector("span");
    k.hidden=false;k.onclick=()=>inp.click();
    inp.onchange=async()=>{
      const f=inp.files[0];if(!f)return;k.disabled=true;lbl.textContent="Laden…";
      try{
        const t=await f.text();
        if(!/window\.BENCHMARK\s*=/.test(t))throw new Error("Dit is geen gegevensbestand van de benchmark-tool. Kies het bestand docs/data.js uit je GitHub-project.");
        const r=await assets.upload(new Blob([t],{type:"text/javascript"}),{type:"text/javascript"});
        const m=t.match(/"bijgewerkt":\s*"([^"]*)"/);
        await db.doc("config/gegevens").set({asset:r.id,bijgewerkt:m?m[1]:"",bestand:f.name,geladen:new Date().toISOString()});
        if(vorig&&vorig!==r.id){try{await assets.delete(vorig);}catch(e){}}
        location.reload();
      }catch(e){alert(e.message||e.code||"Laden mislukt.");k.disabled=false;lbl.textContent="Gegevens laden";inp.value="";}
    };
  }
})();
</script>
